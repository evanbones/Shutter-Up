modLoader = "javafml" 
loaderVersion = "${forge_loader_version_range}" 
license = "${license}" 
issueTrackerURL="https://github.com/evanbones/Shutter-Up/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}" 
logoFile = "${mod_id}.png" 
credits = "Shutter models/textures created by kayla_the_bee" 
authors = "${mod_author}" 
description = '''${description}''' 

[[dependencies.${mod_id}]]
modId = "forge" 
mandatory = true 
versionRange = "[${forge_version},)" 
ordering = "NONE" 
side = "BOTH" 

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
