plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    validateAccessTransformers = true

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = at
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    // Every Compat
    modImplementation "maven.modrinth:moonlight:${moonlight_version}-forge"
    modImplementation "maven.modrinth:every-compat:${every_compat_version}-forge"

    // EMI
    modImplementation "dev.emi:emi-forge:${emi_version}"

    compileOnly project(":common")
    compileOnly 'org.jetbrains:annotations:26.0.2-1'
}

jar {
    finalizedBy('reobfJar')
}

publishMods {
    file = tasks.named("reobfJar").flatMap { it.archiveFile }
    changelog = rootProject.file("CHANGELOG.md").text
    type = STABLE
    displayName = "${mod_name} Forge ${minecraft_version} - ${project.version}"
    modLoaders.add("forge")

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "1420451"
        minecraftVersions.add("1.20.1")

        optional { slug = "every-compat" }
        optional { slug = "vanillabackport" }
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "xaH4PQRj"
        minecraftVersions.add("1.20.1")

        optional { slug = "every-compat" }
        optional { slug = "vanillabackport" }
    }
}
