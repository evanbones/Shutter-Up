plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id "com.matthewprenger.cursegradle" version "1.4.0"
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Every Compat
    modImplementation "maven.modrinth:moonlight:${moonlight_version}-fabric"
    modImplementation "maven.modrinth:every-compat:${every_compat_version}-fabric"

    // EMI
    modLocalRuntime "dev.emi:emi-fabric:${emi_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        datagen {
            client()
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"

            vmArg "-Dfabric-api.datagen.output-dir=${project(":common").file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.strict-validation=true"

            ideConfigGenerated(true)
            runDir("build/datagen")
        }
    }
}

curseforge {
    apiKey = System.getenv("CURSEFORGE_TOKEN") ?: "0"
    project {
        id = "1420451"
        releaseType = "release"
        changelog = file('../CHANGELOG.md')
        changelogType = 'markdown'

        addGameVersion "1.21.1"
        addGameVersion "Java 21"
        addGameVersion "Fabric"

        mainArtifact(remapJar.archiveFile) {
            displayName = "Shutter Up Fabric ${project.minecraft_version} - ${project.version}"
        }

        relations {
            requiredDependency "fabric-api"
            optionalDependency "every-compat"
            optionalDependency "vanillabackport"
        }
    }
    options {
        forgeGradleIntegration = false
    }
}