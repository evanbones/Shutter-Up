plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id "com.matthewprenger.cursegradle" version "1.4.0"
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
}

neoForge {
    version = neoforge_version

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"

    // Every Compat
    implementation "maven.modrinth:moonlight:${moonlight_version}-neoforge"
    implementation "maven.modrinth:every-compat:${every_compat_version}-neoforge"

    // EMI
    runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
}

curseforge {
    apiKey = System.getenv("CURSEFORGE_TOKEN") ?: "0"
    project {
        id = "1420451"
        releaseType = "release"
        changelog = file('../CHANGELOG.md')
        changelogType = 'markdown'

        addGameVersion "1.21.1"
        addGameVersion "Java 21"
        addGameVersion "NeoForge"

        mainArtifact(jar.archiveFile) {
            displayName = "Shutter Up NeoForge ${project.minecraft_version} - ${project.version}"
        }

        relations {
            optionalDependency "every-compat"
            optionalDependency "vanillabackport"
        }
    }
}